<header class="fixed top-0 left-0 w-full z-50">
  <!-- Single Nav Bar matching Stitch exactly -->
  <nav class="flex justify-between items-center h-20 max-w-container-max mx-auto bg-surface-glass border-b border-white/20 shadow-sm backdrop-blur-xl px-margin-mobile md:px-margin-desktop">
    <div class="flex items-center gap-4">
      <a routerLink="/" class="flex items-center gap-3">
        <img src="assets/img/vs%20suitable%20image/shared%20image%20(6).jpg" alt="Vishva Technologies Logo" class="w-10 h-10 rounded-full border border-border-subtle shadow-sm">
        <span class="text-headline-sm font-headline-sm font-black text-primary">Vishva Technologies</span>
      </a>
    </div>

    <div class="hidden xl:flex items-center gap-8">
      <a href="#hero" class="text-secondary font-bold border-b-2 border-secondary pb-1 text-label-md font-label-md" (click)="scrollToSection('hero'); $event.preventDefault()">Home</a>

      <div class="relative group">
        <a href="#services" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md hover:opacity-80 transition-opacity duration-200 flex items-center gap-1" (click)="scrollToSection('services'); $event.preventDefault()">
          Products <i class="bi bi-chevron-down text-[10px]"></i>
        </a>
        <div class="absolute left-0 top-full pt-3 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
          <app-shared-menu heading="Our Products" [items]="productItems"
            featuredImage="assets/img/vs%20suitable%20image/shared%20image%20(6).jpg"
            featuredCaption="Innovate. Automate. Scale!" (select)="productsOpen = false"></app-shared-menu>
        </div>
      </div>

      <div class="relative group">
        <a href="#departments" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md hover:opacity-80 transition-opacity duration-200 flex items-center gap-1" (click)="scrollToSection('departments'); $event.preventDefault()">
          Automation <i class="bi bi-chevron-down text-[10px]"></i>
        </a>
        <div class="absolute left-0 top-full pt-3 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
          <app-shared-menu heading="Intelligent Automation" [items]="automationItems"
            (select)="automationOpen = false"></app-shared-menu>
        </div>
      </div>

      <div class="relative group">
        <a href="#ai-automation" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md hover:opacity-80 transition-opacity duration-200 flex items-center gap-1" (click)="scrollToSection('ai-automation'); $event.preventDefault()">
          AI Offerings <i class="bi bi-chevron-down text-[10px]"></i>
        </a>
        <div class="absolute right-0 top-full pt-3 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
          <app-shared-menu heading="AI Offerings" [items]="aiItems" (select)="aiOfferingsOpen = false">
          </app-shared-menu>
        </div>
      </div>

      <div class="relative group">
        <a href="#portfolio" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md hover:opacity-80 transition-opacity duration-200 flex items-center gap-1" (click)="scrollToSection('portfolio'); $event.preventDefault()">
          Solutions <i class="bi bi-chevron-down text-[10px]"></i>
        </a>
        <div class="absolute right-0 top-full pt-3 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
          <app-shared-menu heading="Industry Solutions" [items]="solutionItems"
            featuredImage="assets/img/vs%20suitable%20image/shared%20image%20(8).jpg"
            featuredCaption="Powering Every Part Of Your Business" (select)="solutionsOpen = false"></app-shared-menu>
        </div>
      </div>

      <a href="#about" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md hover:opacity-80 transition-opacity duration-200" (click)="scrollToSection('about'); $event.preventDefault()">About Us</a>
      <a href="#contact" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md hover:opacity-80 transition-opacity duration-200" (click)="scrollToSection('contact'); $event.preventDefault()">Contact</a>
    </div>

    <button class="bg-primary text-on-primary px-6 py-2 rounded-lg text-label-md font-label-md hover:scale-[1.02] transition-transform duration-300 ease-out hidden md:block" (click)="scrollToSection('appointment'); $event.preventDefault()">
      Get Demo
    </button>

    <button class="xl:hidden text-primary text-2xl" (click)="toggleMobileNav()" aria-label="Toggle navigation">
      <i [class]="mobileNavOpen ? 'bi bi-x' : 'bi bi-list'"></i>
    </button>
  </nav>
</header>

<!-- Mobile Backdrop -->
<div class="mobile-backdrop" [class.show]="mobileNavOpen" (click)="closeMobileNav()"></div>

<!-- Mobile Drawer -->
<div class="mobile-nav-panel" [class.open]="mobileNavOpen" role="dialog" aria-label="Mobile navigation">

  <!-- Drawer Header -->
  <div class="mnp-header">
    <div class="mnp-logo">
      <img src="assets/img/vs%20suitable%20image/shared%20image%20(6).jpg" alt="Vishva Technologies Logo">
      <span>Vishva Technologies</span>
    </div>
    <button class="mnp-close" (click)="closeMobileNav()" aria-label="Close menu">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Nav Links -->
  <nav class="mnp-nav">

    <a href="#hero" class="mnp-link" (click)="scrollToSection('hero'); $event.preventDefault()">
      <span class="mnp-icon"><i class="bi bi-house-door"></i></span>
      <span class="mnp-label">Home</span>
    </a>

    <!-- Products Accordion -->
    <div class="mnp-accordion" [class.open]="productsOpen">
      <button class="mnp-link mnp-accordion-toggle" (click)="toggleProducts()">
        <span class="mnp-icon"><i class="bi bi-grid"></i></span>
        <span class="mnp-label">Products</span>
        <i class="bi bi-chevron-down mnp-chevron"></i>
      </button>
      <div class="mnp-accordion-body">
        <app-shared-menu heading="Our Products" [items]="productItems"
          featuredImage="assets/img/vs%20suitable%20image/shared%20image%20(6).jpg"
          featuredCaption="Innovate. Automate. Scale!" (select)="closeMobileNav()"></app-shared-menu>
      </div>
    </div>

    <!-- Automation Accordion -->
    <div class="mnp-accordion" [class.open]="automationOpen">
      <button class="mnp-link mnp-accordion-toggle" (click)="toggleAutomation()">
        <span class="mnp-icon"><i class="bi bi-gear-wide-connected"></i></span>
        <span class="mnp-label">Automation</span>
        <i class="bi bi-chevron-down mnp-chevron"></i>
      </button>
      <div class="mnp-accordion-body">
        <app-shared-menu heading="Intelligent Automation" [items]="automationItems" (select)="closeMobileNav()">
        </app-shared-menu>
      </div>
    </div>

    <!-- AI Offerings Accordion -->
    <div class="mnp-accordion" [class.open]="aiOfferingsOpen">
      <button class="mnp-link mnp-accordion-toggle" (click)="toggleAiOfferings()">
        <span class="mnp-icon"><i class="bi bi-cpu"></i></span>
        <span class="mnp-label">AI Offerings</span>
        <i class="bi bi-chevron-down mnp-chevron"></i>
      </button>
      <div class="mnp-accordion-body">
        <app-shared-menu heading="AI Offerings" [items]="aiItems" (select)="closeMobileNav()"></app-shared-menu>
      </div>
    </div>

    <!-- Solutions Accordion -->
    <div class="mnp-accordion" [class.open]="solutionsOpen">
      <button class="mnp-link mnp-accordion-toggle" (click)="toggleSolutions()">
        <span class="mnp-icon"><i class="bi bi-briefcase"></i></span>
        <span class="mnp-label">Solutions</span>
        <i class="bi bi-chevron-down mnp-chevron"></i>
      </button>
      <div class="mnp-accordion-body">
        <app-shared-menu heading="Industry Solutions" [items]="solutionItems"
          featuredImage="assets/img/vs%20suitable%20image/shared%20image%20(8).jpg"
          featuredCaption="Powering Every Part Of Your Business" (select)="closeMobileNav()"></app-shared-menu>
      </div>
    </div>

    <a href="#about" class="mnp-link" (click)="scrollToSection('about'); $event.preventDefault()">
      <span class="mnp-icon"><i class="bi bi-info-circle"></i></span>
      <span class="mnp-label">About Us</span>
    </a>

    <a href="#contact" class="mnp-link" (click)="scrollToSection('contact'); $event.preventDefault()">
      <span class="mnp-icon"><i class="bi bi-envelope"></i></span>
      <span class="mnp-label">Contact</span>
    </a>

  </nav>

  <!-- Drawer Footer -->
  <div class="mnp-footer">
    <a href="#appointment" class="mnp-cta" (click)="scrollToSection('appointment'); $event.preventDefault()">
      <i class="bi bi-send-fill"></i> Get a Demo
    </a>
    <div class="mnp-contact-row">
      <a href="tel:+919344964680" class="mnp-contact-link">
        <i class="bi bi-telephone-fill"></i> +91-9344964680
      </a>
    </div>
    <div class="mnp-social">
      <a href="#" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
      <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
    </div>
  </div>

</div>
