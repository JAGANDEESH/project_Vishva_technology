<header class="fixed top-0 left-0 w-full z-50 transition-all duration-300" [class.shadow-md]="isScrolled">
  <!-- Topbar -->
  <div class="hidden md:flex bg-secondary text-on-secondary h-10 items-center justify-center text-label-md w-full">
    <div class="max-w-container-max w-full px-margin-mobile md:px-margin-desktop flex justify-between items-center">
      <div class="flex items-center gap-6">
        <span class="flex items-center gap-2"><i class="bi bi-phone"></i> <a href="tel:+919344964680" class="hover:underline">+91-9344964680</a></span>
        <span class="flex items-center gap-2"><i class="bi bi-envelope"></i> <a href="mailto:info@vishvatechnologies.com" class="hover:underline">info@vishvatechnologies.com</a></span>
      </div>
      <div class="flex items-center gap-4">
        <a href="#" aria-label="Twitter" class="hover:text-primary-fixed transition-colors"><i class="bi bi-twitter-x"></i></a>
        <a href="#" aria-label="Facebook" class="hover:text-primary-fixed transition-colors"><i class="bi bi-facebook"></i></a>
        <a href="#" aria-label="Instagram" class="hover:text-primary-fixed transition-colors"><i class="bi bi-instagram"></i></a>
        <a href="#" aria-label="LinkedIn" class="hover:text-primary-fixed transition-colors"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>
  </div>

  <!-- Branding Row -->
  <div class="bg-surface-glass backdrop-blur-xl border-b border-border-subtle/50 h-20 w-full">
    <div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop h-full flex items-center justify-between">
      
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-4">
        <img src="assets/img/vs%20suitable%20image/shared%20image%20(6).jpg" alt="Vishva Technologies Logo" class="w-12 h-12 rounded-full border-2 border-secondary shadow-sm transition-transform hover:scale-105">
        <span class="text-headline-sm font-headline-sm font-black text-primary hidden lg:block">Vishva Technologies</span>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden xl:flex items-center gap-6">
        <ul class="flex items-center gap-6 m-0 p-0 list-none">
          <li><a href="#hero" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md" (click)="scrollToSection('hero'); $event.preventDefault()">Home</a></li>

          <li class="relative group">
            <a href="#services" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md flex items-center gap-1" (click)="scrollToSection('services'); $event.preventDefault()">
              <span>Products</span> <i class="bi bi-chevron-down text-[12px]"></i>
            </a>
            <div class="absolute left-0 top-full pt-4 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
              <app-shared-menu heading="Our Products" [items]="productItems"
                featuredImage="assets/img/vs%20suitable%20image/shared%20image%20(6).jpg"
                featuredCaption="Innovate. Automate. Scale!" (select)="productsOpen = false"></app-shared-menu>
            </div>
          </li>

          <li class="relative group">
            <a href="#departments" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md flex items-center gap-1" (click)="scrollToSection('departments'); $event.preventDefault()">
              <span>Automation</span> <i class="bi bi-chevron-down text-[12px]"></i>
            </a>
            <div class="absolute left-0 top-full pt-4 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
              <app-shared-menu heading="Intelligent Automation" [items]="automationItems"
                (select)="automationOpen = false"></app-shared-menu>
            </div>
          </li>

          <li class="relative group">
            <a href="#ai-automation" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md flex items-center gap-1" (click)="scrollToSection('ai-automation'); $event.preventDefault()">
              <span>AI Offerings</span> <i class="bi bi-chevron-down text-[12px]"></i>
            </a>
            <div class="absolute right-0 top-full pt-4 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
              <app-shared-menu heading="AI Offerings" [items]="aiItems" (select)="aiOfferingsOpen = false">
              </app-shared-menu>
            </div>
          </li>

          <li class="relative group">
            <a href="#portfolio" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md flex items-center gap-1" (click)="scrollToSection('portfolio'); $event.preventDefault()">
              <span>Solutions</span> <i class="bi bi-chevron-down text-[12px]"></i>
            </a>
            <div class="absolute right-0 top-full pt-4 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
              <app-shared-menu heading="Industry Solutions" [items]="solutionItems"
                featuredImage="assets/img/vs%20suitable%20image/shared%20image%20(8).jpg"
                featuredCaption="Powering Every Part Of Your Business" (select)="solutionsOpen = false"></app-shared-menu>
            </div>
          </li>

          <li><a href="#about" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md" (click)="scrollToSection('about'); $event.preventDefault()">About Us</a></li>
          <li><a href="#contact" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md" (click)="scrollToSection('contact'); $event.preventDefault()">Contact</a></li>
        </ul>
      </nav>

      <div class="hidden md:flex items-center gap-4">
        <a href="#appointment" class="bg-primary text-on-primary px-6 py-2 rounded-lg text-label-md font-label-md hover:scale-[1.02] transition-transform duration-300 ease-out shadow-sm" (click)="scrollToSection('appointment'); $event.preventDefault()">Get a Demo</a>
      </div>

      <!-- Mobile Toggle -->
      <button class="xl:hidden text-primary text-2xl" (click)="toggleMobileNav()" aria-label="Toggle navigation">
        <i [class]="mobileNavOpen ? 'bi bi-x' : 'bi bi-list'"></i>
      </button>
    </div>
  </div>
</header>

<!-- Mobile Backdrop -->
<div class="mobile-backdrop" [class.show]="mobileNavOpen" (click)="closeMobileNav()"></div>

<!-- Mobile Drawer -->
<div class="mobile-nav-panel" [class.open]="mobileNavOpen" role="dialog" aria-label="Mobile navigation">

  <!-- Drawer Header -->
  <div class="mnp-header">
    <div class="mnp-logo">
      <img src="assets/img/vs%20suitable%20image/shared%20image%20(6).jpg" alt="Vishva Technologies Logo">
      <span>Vishva Technologies</span>
    </div>
    <button class="mnp-close" (click)="closeMobileNav()" aria-label="Close menu">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Nav Links -->
  <nav class="mnp-nav">

    <a href="#hero" class="mnp-link" (click)="scrollToSection('hero'); $event.preventDefault()">
      <span class="mnp-icon"><i class="bi bi-house-door"></i></span>
      <span class="mnp-label">Home</span>
    </a>

    <!-- Products Accordion -->
    <div class="mnp-accordion" [class.open]="productsOpen">
      <button class="mnp-link mnp-accordion-toggle" (click)="toggleProducts()">
        <span class="mnp-icon"><i class="bi bi-grid"></i></span>
        <span class="mnp-label">Products</span>
        <i class="bi bi-chevron-down mnp-chevron"></i>
      </button>
      <div class="mnp-accordion-body">
        <app-shared-menu heading="Our Products" [items]="productItems"
          featuredImage="assets/img/vs%20suitable%20image/shared%20image%20(6).jpg"
          featuredCaption="Innovate. Automate. Scale!" (select)="closeMobileNav()"></app-shared-menu>
      </div>
    </div>

    <!-- Automation Accordion -->
    <div class="mnp-accordion" [class.open]="automationOpen">
      <button class="mnp-link mnp-accordion-toggle" (click)="toggleAutomation()">
        <span class="mnp-icon"><i class="bi bi-gear-wide-connected"></i></span>
        <span class="mnp-label">Automation</span>
        <i class="bi bi-chevron-down mnp-chevron"></i>
      </button>
      <div class="mnp-accordion-body">
        <app-shared-menu heading="Intelligent Automation" [items]="automationItems" (select)="closeMobileNav()">
        </app-shared-menu>
      </div>
    </div>

    <!-- AI Offerings Accordion -->
    <div class="mnp-accordion" [class.open]="aiOfferingsOpen">
      <button class="mnp-link mnp-accordion-toggle" (click)="toggleAiOfferings()">
        <span class="mnp-icon"><i class="bi bi-cpu"></i></span>
        <span class="mnp-label">AI Offerings</span>
        <i class="bi bi-chevron-down mnp-chevron"></i>
      </button>
      <div class="mnp-accordion-body">
        <app-shared-menu heading="AI Offerings" [items]="aiItems" (select)="closeMobileNav()"></app-shared-menu>
      </div>
    </div>

    <!-- Solutions Accordion -->
    <div class="mnp-accordion" [class.open]="solutionsOpen">
      <button class="mnp-link mnp-accordion-toggle" (click)="toggleSolutions()">
        <span class="mnp-icon"><i class="bi bi-briefcase"></i></span>
        <span class="mnp-label">Solutions</span>
        <i class="bi bi-chevron-down mnp-chevron"></i>
      </button>
      <div class="mnp-accordion-body">
        <app-shared-menu heading="Industry Solutions" [items]="solutionItems"
          featuredImage="assets/img/vs%20suitable%20image/shared%20image%20(8).jpg"
          featuredCaption="Powering Every Part Of Your Business" (select)="closeMobileNav()"></app-shared-menu>
      </div>
    </div>

    <a href="#about" class="mnp-link" (click)="scrollToSection('about'); $event.preventDefault()">
      <span class="mnp-icon"><i class="bi bi-info-circle"></i></span>
      <span class="mnp-label">About Us</span>
    </a>

    <a href="#contact" class="mnp-link" (click)="scrollToSection('contact'); $event.preventDefault()">
      <span class="mnp-icon"><i class="bi bi-envelope"></i></span>
      <span class="mnp-label">Contact</span>
    </a>

  </nav>

  <!-- Drawer Footer -->
  <div class="mnp-footer">
    <a href="#appointment" class="mnp-cta" (click)="scrollToSection('appointment'); $event.preventDefault()">
      <i class="bi bi-send-fill"></i> Get a Demo
    </a>
    <div class="mnp-contact-row">
      <a href="tel:+919344964680" class="mnp-contact-link">
        <i class="bi bi-telephone-fill"></i> +91-9344964680
      </a>
    </div>
    <div class="mnp-social">
      <a href="#" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
      <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
    </div>
  </div>

</div>
