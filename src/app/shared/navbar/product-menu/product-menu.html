<div class="mega-menu">
  <div class="container-fluid p-0">
    <div class="row g-0">
      
      <!-- Main Content Area: Product Categories -->
      <div class="col-lg-9 p-4 main-pane">
        <div class="row row-cols-1 row-cols-md-2 g-4">
          <div class="col" *ngFor="let cat of categories">
            <div class="category-group">
              <h6 class="category-title d-flex align-items-center mb-3">
                <i class="bi" [ngClass]="cat.icon"></i>
                {{ cat.title }}
              </h6>
              
              <div class="product-list">
                <a 
                  *ngFor="let prod of cat.products" 
                  [routerLink]="prod.link" 
                  class="product-item d-flex align-items-start"
                  (click)="onProductClick()">
                  <div class="prod-icon-wrap">
                    <i class="bi" [ngClass]="prod.icon"></i>
                  </div>
                  <div class="prod-info">
                    <span class="prod-name">{{ prod.title }}</span>
                    <p class="prod-desc">{{ prod.description }}</p>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Featured Sidebar / CTA -->
      <div class="col-lg-3 p-4 featured-pane light-background">
        <div class="featured-content">
          <span class="badge mb-2">Featured</span>
          <h5>Experience vSuite</h5>
          <p class="mb-4 small">See how Vishva Digital Technologies can transform your business operations with intelligent automation.</p>
          
          <div class="cta-stack d-grid gap-2">
            <a href="#appointment" class="btn btn-primary btn-sm cta-btn" (click)="onProductClick()">
              <i class="bi bi-send-fill me-2"></i> Get a Demo
            </a>
            <a href="#services" class="btn btn-outline-primary btn-sm cta-btn" (click)="onProductClick()">
              Explore All Products
            </a>
          </div>

          <div class="mt-4 stats-mini border-top pt-3">
            <div class="d-flex align-items-center mb-2">
              <i class="bi bi-check-circle-fill text-success me-2"></i>
              <span class="small">GST Ready & Compliant</span>
            </div>
            <div class="d-flex align-items-center mb-2">
              <i class="bi bi-check-circle-fill text-success me-2"></i>
              <span class="small">AI-Powered Automation</span>
            </div>
            <div class="d-flex align-items-center">
              <i class="bi bi-check-circle-fill text-success me-2"></i>
              <span class="small">24/7 Enterprise Support</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
