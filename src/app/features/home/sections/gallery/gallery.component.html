<section id="gallery" class="py-24 max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop bg-background">
  <div data-aos="fade-up" data-aos-delay="100">
    <div class="text-center mb-16" data-aos="fade-up">
      <h2 class="text-headline-lg font-headline-lg text-primary mb-4">Our Work</h2>
      <p class="text-body-lg font-body-lg text-text-muted max-w-3xl mx-auto">A glimpse of the products and interfaces we've crafted for our clients.</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <div *ngFor="let img of images; let i = index"
           data-aos="fade-up" [attr.data-aos-delay]="(i%4+1)*100"
           class="group relative rounded-[16px] overflow-hidden hover:scale-[1.02] transition-transform duration-300 shadow-sm">
        <a [href]="img" class="glightbox block" [attr.data-gallery]="'images-gallery'">
          <img [src]="img" [alt]="'Portfolio work ' + (i+1)" class="w-full h-[260px] object-cover group-hover:scale-110 transition-transform duration-500">
          <div class="absolute inset-0 bg-gradient-to-t from-primary/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-center pb-6">
            <span class="text-white text-label-md font-label-md bg-white/20 backdrop-blur-sm px-4 py-1.5 rounded-full"><i class="bi bi-zoom-in mr-2"></i>View</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
